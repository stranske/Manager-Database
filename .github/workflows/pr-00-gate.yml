# -----------------------------------------------------------------------------
# Gate Workflow — Consumer Repository Template
# -----------------------------------------------------------------------------
# Orchestrates CI enforcement for pull requests. The `summary` job aggregates
# results and publishes the commit status that keepalive automation relies on.
#
# USAGE:
#   - Standard Python projects: Use this template as-is
#   - Custom projects: Use as a STARTING POINT, customize the test job(s)
#
# IMPORTANT: The `summary` job and `Gate / gate` commit status are REQUIRED
# for keepalive automation to detect CI results. Do not remove or rename them.
#
# SYNC BEHAVIOR:
#   - This file is NOT auto-synced to repos with custom Gate workflows
#   - Repos in CUSTOM_GATE_REPOS list in maint-68-sync-consumer-repos.yml
#     maintain their own Gate and should update manually if needed
#
# Copy this file to: .github/workflows/pr-00-gate.yml
#
# Required secrets: None (uses GITHUB_TOKEN)
# Optional secrets: Passed via `secrets: inherit` to reusable workflow
#
# Examples of custom Gates based on this template:
#   - stranske/trip-planner (Flask + requirements.txt)
#   - stranske/Manager-Database (FastAPI + docker-compose)
# -----------------------------------------------------------------------------

name: Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref_name }}-gate
  cancel-in-progress: true

jobs:
  resolve-pr:
    name: resolve Gate PR context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pull_request: ${{ steps.resolve.outputs.pull_request }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: resolve
        env:
          PR_NUMBER: ''
        with:
          script: |
            let pr = context.payload.pull_request || null;
            const dispatchedPr = context.eventName === 'workflow_dispatch' && process.env.PR_NUMBER;
            if (pr || dispatchedPr) {
              const number = dispatchedPr ? Number(process.env.PR_NUMBER) : pr.number;
              if (!Number.isSafeInteger(number) || number <= 0
                  || (dispatchedPr && String(number) !== process.env.PR_NUMBER)) {
                throw new Error('pr_number must be a positive integer');
              }
              const { data } = await github.rest.pulls.get({
                ...context.repo, pull_number: number,
              });
              if (dispatchedPr) {
                if (data.state !== 'open' || data.head.repo.full_name !== process.env.GITHUB_REPOSITORY
                    || data.head.sha !== context.sha) {
                  throw new Error('Dispatch must target the current open same-repository PR head');
                }
              } else if (data.state !== 'open' || data.number !== pr.number
                  || data.head?.sha !== pr.head?.sha
                  || data.head?.repo?.full_name !== pr.head?.repo?.full_name
                  || data.head?.ref !== pr.head?.ref || data.base?.ref !== pr.base?.ref) {
                throw new Error('PR identity changed before Gate metadata refresh');
              }
              // A rerun keeps the original event body. Refresh mutable metadata
              // only after preserving the immutable PR/head/repository binding.
              pr = dispatchedPr ? data : { ...pr, title: data.title, body: data.body, labels: data.labels,
                state: data.state };
            }
            core.setOutput('pull_request', JSON.stringify(pr));

  detect:
    needs: ["resolve-pr"]
    name: classify changed paths
    runs-on: ubuntu-latest
    outputs:
      is_docs_only: ${{ steps.classify.outputs.is-docs-only || 'false' }}
      is_python_code: ${{ steps.classify.outputs.is-python-code || 'true' }}
      is_workflow_change: ${{ steps.classify.outputs.is-workflow-change || 'false' }}
      is_security_relevant: ${{ steps.classify.outputs.is-security-relevant || 'true' }}
      classification_rationale: ${{ steps.classify.outputs.classification-rationale || 'path classifier unavailable' }}
    env:
      GATE_PR_JSON: ${{ needs.resolve-pr.outputs.pull_request }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Classify changed paths
        id: classify
        uses: stranske/Workflows/.github/actions/path-classifier@40e80e510f61e81f5612064b035a77e9b8d28756
        with:
          force-full: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'verify:full') || github.event_name == 'schedule' }}

  generated-delivery-seal:
    name: generated delivery seal
    needs: resolve-pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require an exact-head delivery seal
        uses: stranske/Workflows/.github/actions/generated-delivery-seal@fe1efdada4ece0e9668db83ae3867e74c29c7744
        with:
          pull-request-json: ${{ needs.resolve-pr.outputs.pull_request }}

  python-ci:
    name: Python CI
    needs: detect
    if: >-
      ${{
        needs.detect.outputs.is_docs_only != 'true' &&
        needs.detect.outputs.is_python_code == 'true'
      }}
    uses: stranske/Workflows/.github/workflows/reusable-10-ci-python.yml@main
    with:
      python-versions: '["3.13", "3.14"]'
      coverage: true
      coverage-min: "75"
      # Coverage was already MEASURED here; only the reporting leg was off, because
      # `enable-soft-gate` defaults to false. So the Gate computed a coverage number every
      # run and then discarded it -- no trend artifact, no hotspot table, and nothing for
      # Maint Coverage Guard to read. Report-only: the soft gate runs coverage_trend.py with
      # --soft, which always exits 0, so this cannot fail a PR.
      # Measured 78.01% on this repo's own 2026-08-25 Gate payload, against the floor of 75.
      enable-soft-gate: true
      typecheck: true
      format_check: true
      pytest_markers: "not nightly"  # Skip nightly integration tests
      working-directory: "."
      artifact-prefix: "gate-"
    secrets: inherit

  summary:
    name: gate-summary
    needs: ["detect", "python-ci", "generated-delivery-seal"]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    outputs:
      state: ${{ steps.summarize.outputs.state }}
      description: ${{ steps.summarize.outputs.description }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Summarize results
        id: summarize
        env:
          DELIVERY_SEAL_RESULT: ${{ needs.generated-delivery-seal.result || 'skipped' }}
          DETECT_RESULT: ${{ needs.detect.result || 'skipped' }}
          PYTHON_RESULT: ${{ needs.python-ci.result || 'skipped' }}
        run: |
          set -euo pipefail

          python_result="${PYTHON_RESULT:-skipped}"
          state="success"
          description="All checks passed"

          case "$python_result" in
            success)
              state="success"
              description="Python CI passed"
              ;;
            failure)
              state="failure"
              description="Python CI failed"
              ;;
            cancelled)
              state="error"
              description="Python CI was cancelled"
              ;;
            skipped)
              state="success"
              description="Python CI skipped (no relevant changes)"
              ;;
            *)
              state="pending"
              description="Python CI status unknown"
              ;;
          esac

          detect_result="${DETECT_RESULT:-skipped}"
          if [[ "${detect_result}" != "success" ]]; then
            if [[ "${detect_result}" == "failure" ]]; then
              state="failure"
              description="Path classification failed"
            elif [[ "${detect_result}" == "cancelled" ]]; then
              state="error"
              description="Path classification was cancelled"
            else
              state="pending"
              description="Path classification status unknown"
            fi
          fi

          # Expose the same seal precondition already enforced by the classifier.
          # Never turn an existing product failure into a weaker pending result.
          seal_result="${DELIVERY_SEAL_RESULT:-skipped}"
          if [[ "${seal_result}" != "success" && "${state}" != "failure" && "${state}" != "error" ]]; then
            if [[ "${seal_result}" == "failure" ]]; then
              state="failure"
            elif [[ "${seal_result}" == "cancelled" ]]; then
              state="error"
            else
              state="pending"
            fi
            description="Generated delivery seal did not succeed"
          fi

          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo "description=${description}" >> "$GITHUB_OUTPUT"
          echo "[Gate] State: ${state}, Description: ${description}"

      - name: Report Gate commit status
        if: ${{ always() }}
        uses: actions/github-script@v9.0.0
        env:
          STATE: ${{ steps.summarize.outputs.state || 'pending' }}
          DESCRIPTION: ${{ steps.summarize.outputs.description || 'Gate status pending' }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.pull_request?.head?.sha ?? context.sha;
            const rawState = process.env.STATE || 'pending';
            const allowed = new Set(['error', 'failure', 'pending', 'success']);
            const state = allowed.has(rawState) ? rawState : 'pending';
            const rawDescription = process.env.DESCRIPTION || 'Gate status update';
            const description = rawDescription.length > 140 ? `${rawDescription.slice(0, 137)}...` : rawDescription;
            const targetUrl = process.env.TARGET_URL;

            try {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha,
                state,
                context: 'Gate / gate',
                description,
                target_url: targetUrl,
              });
              console.log(`Created commit status: ${state} - ${description}`);
            } catch (error) {
              const responseHeaders = error?.response?.headers || {};
              const hitRateLimit =
                error?.status === 403 &&
                (/rate limit|abuse/i.test(error?.message || '') ||
                  /rate limit|abuse/i.test(error?.response?.data?.message || '') ||
                  String(responseHeaders['x-ratelimit-remaining']) === '0' ||
                  responseHeaders['retry-after'] != null);
              // Pull requests opened from forks receive a read-only token, so the
              // status write is refused even after Gate has computed its verdict.
              // Keep same-repository permission failures loud and preserve the
              // existing rate-limit path.
              const pullRequest = context.payload.pull_request;
              const headRepoObject = pullRequest?.head?.repo;
              const headRepo = headRepoObject?.full_name;
              const baseRepo = pullRequest?.base?.repo?.full_name;
              const isForkPullRequest = Boolean(
                baseRepo &&
                  (headRepoObject === null || (headRepo && headRepo !== baseRepo)),
              );
              const readOnlyForkToken =
                error?.status === 403 && isForkPullRequest && !hitRateLimit;
              if (hitRateLimit) {
                core.warning('Rate limit prevented Gate from updating the commit status.');
              } else if (readOnlyForkToken) {
                core.warning(
                  'Fork pull request from ' +
                    `${headRepo ?? pullRequest?.head?.label ?? 'deleted source repository'}: ` +
                    'the workflow token is ' +
                    "read-only, so the 'Gate / gate' commit status could not be " +
                    `written (${error.message}). Gate verdict for ${sha} is ` +
                    `'${state}': ${description}.`,
                );
                await core.summary
                  .addHeading('Gate verdict (fork pull request)', 3)
                  .addRaw(
                    'The `Gate / gate` commit status could not be written for ' +
                      `\`${sha}\` because a pull request from a fork receives a ` +
                      `read-only token. Gate verdict: **${state}** — ${description}`,
                  )
                  .write();
              } else {
                throw error;
              }
            }

      - name: Enforce Gate success
        if: ${{ steps.summarize.outputs.state == 'failure' }}
        run: |
          echo "Gate reported failure: ${{ steps.summarize.outputs.description }}" >&2
          exit 1
